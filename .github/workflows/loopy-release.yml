name: Loopy Release

# Fork-only, so upstream merges never touch it. Upstream's release workflows
# stay disabled here: they need Blacksmith runners and upstream accounts.
# A `v*.*.*` tag builds macOS apps for arm64 and x64 and attaches them, with
# the merged updater manifest, to a draft release. Tag builds are ad-hoc signed
# unless the LOOPY_SIGNED_RELEASES repository variable is `true`, which makes
# them signed and notarized. A manual run is an unsigned dry run whose output
# stays in workflow artifacts.
# Runbook: docs/operations/06_loopy-release.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      signed: ${{ steps.version.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false

      - id: version
        name: Resolve version
        shell: bash
        env:
          SIGNED_RELEASES: ${{ vars.LOOPY_SIGNED_RELEASES }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<prerelease>]."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "signed=$([[ "${SIGNED_RELEASES:-}" == "true" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            # A dry run never becomes a release; it only needs a valid semver.
            version="$(jq -r .version apps/desktop/package.json)-dryrun.$GITHUB_RUN_NUMBER"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require signing secrets
        if: steps.version.outputs.signed == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::LOOPY_SIGNED_RELEASES is true, but these are not set: ${missing[*]}. APPLE_TEAM_ID is a repository variable; the rest are repository secrets. See docs/operations/06_loopy-release.md."
            exit 1
          fi

  build:
    name: Build macOS ${{ matrix.arch }}
    needs: preflight
    # Both architectures build on Apple Silicon; x64 is cross-built, as upstream
    # does. The Apple Speech helper needs the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x64
            rust_target: x86_64-apple-darwin
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SIGNED: ${{ needs.preflight.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
          # Both jobs install the same store on the same runner type.
          save-pnpm-store: ${{ matrix.arch == 'arm64' }}

      # The x64 build runs x64 Electron to generate the server's bytecode cache.
      - name: Ensure Rosetta
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # The update feed is this repository (GITHUB_REPOSITORY). No Clerk or
      # relay values are set, so the app ships with T3 Connect off.
      - name: Build desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ needs.preflight.outputs.signed == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ needs.preflight.outputs.signed == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ needs.preflight.outputs.signed == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ needs.preflight.outputs.signed == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ needs.preflight.outputs.signed == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          set -euo pipefail
          args=(--platform mac --target dmg --arch "${{ matrix.arch }}" --build-version "$VERSION" --verbose)
          if [[ "$SIGNED" == "true" ]]; then
            # electron-builder's notarization reads the API key from a file.
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            (umask 077 && printf '%s' "$APPLE_API_KEY" > "$key_path")
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
          fi
          vp run dist:desktop:artifact "${args[@]}"

      # .env.example holds T3's public Clerk and relay ids, and upstream's
      # preview builds copy it in. Loopy must never ship them.
      - name: Refuse upstream Clerk and relay values in the bundle
        shell: bash
        run: |
          set -euo pipefail
          env_example() { sed -n "s|^$1=||p" .env.example; }
          relay_url="$(env_example T3CODE_RELAY_URL)"
          for value in \
            "$(env_example T3CODE_CLERK_PUBLISHABLE_KEY)" \
            "$(env_example T3CODE_CLERK_CLI_OAUTH_CLIENT_ID)" \
            "${relay_url#https://}"; do
            [[ -n "$value" ]] || continue
            if grep -rlF -- "$value" apps/server/dist apps/desktop/dist-electron; then
              echo "::error::The bundle contains '$value' from .env.example (T3's Clerk or relay)."
              exit 1
            fi
          done

      - name: Verify signature and notarization
        if: env.SIGNED == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/loopy-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$(ls release/*.dmg)"
          trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
          app="$(ls -d "$mount"/*.app)"
          codesign --verify --deep --strict --verbose=2 "$app"
          team="$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [[ "$team" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::The app is signed by team '$team', not APPLE_TEAM_ID '$APPLE_TEAM_ID'."
            exit 1
          fi
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      # electron-builder names both architectures' manifest `latest-mac.yml`;
      # the x64 copy gets a suffix so the release job can merge the two.
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-publish
          for file in release/*.dmg release/*.zip release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-x64.yml"
            done
          fi
          ls -l release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          # Installers, zips and blockmaps are already compressed.
          compression-level: 0

  release:
    name: Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-mac-*
          merge-multiple: true
          path: release-assets

      # electron-updater reads one manifest per channel and picks the entry for
      # the running arch, so it must list both.
      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(release-assets/*-mac-x64.yml)
          if (( ${#manifests[@]} == 0 )); then
            echo "::error::The x64 build produced no updater manifest."
            exit 1
          fi
          for x64 in "${manifests[@]}"; do
            node scripts/merge-update-manifests.ts --platform mac "${x64%-x64.yml}.yml" "$x64"
            rm "$x64"
          done
          cat release-assets/*.yml

      - name: Upload merged updater manifest
        if: needs.preflight.outputs.release != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-manifest
          path: release-assets/*.yml
          if-no-files-found: error

      - name: Create draft release
        if: needs.preflight.outputs.release == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Loopy v${{ needs.preflight.outputs.version }}
          draft: true
          prerelease: ${{ contains(needs.preflight.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}
