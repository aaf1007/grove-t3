name: Fork CI

# Upstream's workflows are disabled in this fork: they need Blacksmith runners or
# upstream accounts. This file is fork-only, so upstream merges never touch it.
# It runs the checks AGENTS.md asks for before a push, on the PR's changes only.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check_changed:
    name: Check changed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # check:changed diffs against the merge base with the PR's base branch.
          fetch-depth: 0

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Check changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # A push checks everything it introduced; a new branch (all-zero before) falls back to the first parent.
          case "$EVENT_NAME" in
            pull_request) base="origin/$BASE_REF" ;;
            push) base="$PUSH_BEFORE"; [ "${base#*[!0]}" = "$base" ] && base=HEAD^1 ;;
            *) base=origin/main ;;
          esac
          vp run check:changed "$base"
